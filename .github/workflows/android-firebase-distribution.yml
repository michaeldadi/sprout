name: Deploy Android App to Firebase App Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Build and Distribute Android App
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x apps/android/gradlew

    - name: Validate and install Firebase release configuration
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        for secret in GOOGLE_SERVICES_JSON LOCAL_PROPERTIES FIREBASE_APP_ID_ANDROID FIREBASE_SERVICE_ACCOUNT; do
          if [[ -z "${!secret}" ]]; then
            echo "::error::Missing Firebase release secret: $secret"
            exit 1
          fi
        done
        umask 077
        if ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > apps/android/app/google-services.json ||
           ! jq -e '.client | type == "array" and length > 0' apps/android/app/google-services.json > /dev/null 2>&1; then
          echo "::error::GOOGLE_SERVICES_JSON must contain a base64-encoded Firebase Android configuration."
          exit 1
        fi
        printf '%s' "$LOCAL_PROPERTIES" | base64 --decode > apps/android/local.properties

    - name: Build Release APK
      run: |
        cd apps/android
        ./gradlew assembleRelease

    - name: Build Release AAB
      run: |
        cd apps/android
        ./gradlew bundleRelease

    - name: Upload APK to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: apps/android/app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          🚀 New build from main branch
          
          Commit: ${{ github.sha }}
          Dispatched by: ${{ github.actor }}

    - name: Upload AAB as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: apps/android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: apps/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Clean up secrets
      if: always()
      run: |
        rm -f apps/android/app/google-services.json
        rm -f apps/android/local.properties
